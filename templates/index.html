<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <title>Crud</title>
</head>
<body>
    <div>
        <form action="{{ url_for('users_route.create') }}" method="post">
            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome" name="name">
            
            <br><br>
            
            <label for="senha">Digite sua senha</label>
            <input type="password" id="senha" name="password">
            
            <br><br>

            <label for="senha">Digite seu email</label>
            <input type="email" id="email" name="email">
            
            <br><br>

            <label for="senha">Digite seu Telefone</label>
            <input type="tel" id="fone" name="fone">
            
            <br><br>
            
            <button type="submit">Enviar</button>
        </form>

        <table>
            {% for user in users %}
            <tr>
                <td>{{ user.name }}</td>
                <td>
                    <form action="{{ url_for('users_route.delete', user_id=user.id) }}" method="post">
                        <button type="submit">Deletar</button>
                    </form>
                    <form action="{{ url_for('users_route.render_update', id=user.id) }}" method="get">
                        <button type="submit">Editar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
