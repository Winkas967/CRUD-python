<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body>
    <div>
            <form action="{{ url_for('users_route.update', id=user.id) }}" method="post">
                
                    <label for="nome">Digite seu novo nome</label>
                    <input type="text" id="nome" name="new_name">
            
                    <br><br>
            
                    <label for="senha">Digite sua nova senha</label>
                    <input type="password" id="senha" name="new_password">
            
                    <br><br>

                    <label for="email">Digite seu novo email</label>
                    <input type="email" id="email" name="new_email">
            
                    <br><br>

                    <label for="fone">Digite seu novo telefone</label>
                    <input type="tel" id="fone" name="new_fone">
            
                    <br><br>
            
                    <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
